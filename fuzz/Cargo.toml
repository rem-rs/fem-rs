[workspace]

[package]
name = "fem-io-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.fem-io]
path = "../crates/io"

[dependencies.fem-core]
path = "../crates/core"

# Prevent default features from pulling in HDF5 (which requires system libs)
[dependencies.fem-mesh]
path = "../crates/mesh"

# Optimisation: disable debug assertions in fuzz builds for speed
[profile.release]
debug-assertions = false

[[bin]]
name = "fuzz_gmsh"
path = "fuzz_targets/fuzz_gmsh.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_netgen"
path = "fuzz_targets/fuzz_netgen.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_abaqus"
path = "fuzz_targets/fuzz_abaqus.rs"
test = false
doc = false
bench = false
