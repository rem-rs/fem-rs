[package]
name    = "fem-linalg-gpu"
version = "0.1.0"
edition = "2021"

[dependencies]
fem-core   = { path = "../core" }
fem-linalg = { path = "../linalg" }
# The hex PA shaders must mirror the element layer's GLL nodes and slot order
# (D82: `generate_hex_qk_wgsl` derives both from `HexQk` via
# `lagrange::hex::hex_tensor_layout`), so the element crate is a real
# dependency here, not just a dev one.
fem-element = { path = "../element" }
fem-amg    = { path = "../amg", optional = true }
bytemuck   = { workspace = true }
wgpu       = "27"
pollster   = "0.4"
thiserror  = "2"
log        = { workspace = true }
cust       = { version = "0.3", optional = true }

[features]
default = []
cuda    = ["dep:cust"]
amg     = ["dep:fem-amg"]

[lib]
crate-type = ["lib"]

[dev-dependencies]
fem-mesh     = { path = "../mesh" }
fem-space    = { path = "../space" }
fem-assembly = { path = "../assembly" }
fem-solver   = { path = "../solver" }
fem-element  = { path = "../element" }
# D808: the shipped `wgsl/` sources must *parse as WGSL*.  `naga` is the same
# front end `wgpu` compiles them with (wgpu 27 pulls naga 27), and it is
# declared here so a GPU-less machine can still pin shader validity — the
# defect class that bit twice (D777's dropped `cs_main` brace in the hex
# template, D808's `if`-expressions in `quad_q1.wgsl`).  `default-features =
# false` + `wgsl-in` is a subset of what `wgpu` already enables, so this adds no
# new dependency to the lock file.
naga = { version = "27", default-features = false, features = ["wgsl-in"] }
