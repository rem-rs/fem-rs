[package]
name    = "fem-mesh"
version = "0.1.0"
edition = "2021"

[dependencies]
fem-core    = { path = "../core" }
fem-element = { path = "../element" }
nalgebra    = { workspace = true }
thiserror   = { workspace = true }
serde       = { workspace = true, optional = true }

[features]
serialize = ["serde"]

[dev-dependencies]
tempfile = "3"
serde_json = "1"
fem-assembly = { path = "../assembly" }
fem-solver   = { path = "../solver" }
fem-space    = { path = "../space" }
fem-linalg   = { path = "../linalg" }
