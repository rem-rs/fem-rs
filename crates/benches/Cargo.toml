[package]
name = "fem-benches"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
fem-element = { path = "../element" }
fem-core = { path = "../core" }
fem-mesh = { path = "../mesh" }
fem-space = { path = "../space" }
fem-assembly = { path = "../assembly" }
fem-linalg = { path = "../linalg" }
fem-linalg-gpu = { path = "../linalg-gpu" }
fem-solver = { path = "../solver", features = ["gpu"] }
fem-amg = { path = "../amg" }
criterion = { workspace = true }
wgpu = "27"

[features]
default = ["parallel"]
parallel = ["fem-assembly/parallel", "fem-linalg/parallel"]

[[bench]]
name = "assembly"
harness = false
path = "assembly.rs"

[[bench]]
name = "solver"
harness = false
path = "solver.rs"

[[bench]]
name = "amg"
harness = false
path = "amg.rs"

[[bench]]
name = "mesh"
harness = false
path = "mesh.rs"

[[bench]]
name = "micro"
harness = false
path = "micro.rs"

[[bench]]
name = "gpu_micro"
harness = false
path = "gpu_micro.rs"

[[bench]]
name = "solver_comparison"
harness = false
path = "solver_comparison.rs"
