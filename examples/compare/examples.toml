# MFEM 示例 1:1 比对配置
#
# 每个示例的配置项：
#   mesh        — 默认 mesh 文件（相对 data/）
#   rust_args   — 传给 Rust 示例的参数
#   cpp_args    — 传给 C++ 参考的参数（含 -m 的 WSL 路径会由 compare.py 自动转换）
#   compare     — 比对模式：dof | eigenvalue | sol_gf | residual | conv_avg | none
#   tolerance   — 比对容差（默认 1e-6）
#   note        — 备注说明

[general]
# 全局设置
mesh_dir_rust = "data"
mesh_dir_cpp  = "/home/quan/mfem49/data"
cpp_bin_dir   = "~/bin"

# ─── 串行示例 ─────────────────────────────────────────────────────────────────

[ex0]
mesh    = "star.mesh"
args    = "-no-vis"
compare = "dof+conv_avg"

[ex1]
mesh    = "star.mesh"
args    = "-no-vis"
compare = "dof+iter"

[ex2]
mesh    = "beam-tri.mesh"
args    = "-no-vis"
compare = "dof+iter"

[ex3]
mesh    = "beam-tet.mesh"
args    = "-no-vis"
compare = "dof+cg"

[ex4]
mesh    = "star.mesh"
args    = "-no-vis"
compare = "dof+iter"

[ex5]
mesh    = "star.mesh"
args    = "-no-vis"
compare = "dof+minres"
note    = "MINRES 迭代数可能因预处理器实现不同而有差异（Rust 423 vs C++ 396）"

[ex6]
mesh    = "square-disc.mesh"
args    = "-o 1 -no-vis"
compare = "dof"

[ex7]
mesh    = "star.mesh"
args    = "-no-vis"
