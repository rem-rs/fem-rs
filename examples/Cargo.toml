[features]
default = []
gpu = ["fem-solver/gpu", "fem-linalg-gpu", "wgpu", "bytemuck"]
io_hdf5 = ["fem-io-hdf5-parallel/hdf5"]
io_hdf5_mpi = ["fem-io-hdf5-parallel/hdf5-mpi"]

[package]
name    = "fem-examples"
version = "0.1.0"
edition = "2021"

[dependencies]
fem-core     = { path = "../crates/core" }
fem-mesh     = { path = "../crates/mesh" }
fem-linalg   = { path = "../crates/linalg" }
fem-io       = { path = "../crates/io" }
fem-parallel = { path = "../crates/parallel" }
fem-element  = { path = "../crates/element" }
fem-space    = { path = "../crates/space" }
fem-assembly = { path = "../crates/assembly" }
fem-solver   = { path = "../crates/solver" }
fem-amg      = { path = "../crates/amg" }
fem-stochastic = { path = "../crates/stochastic" }
fem-io-hdf5-parallel = { path = "../crates/io_hdf5_parallel" }
fem-linalg-gpu = { path = "../crates/linalg-gpu", optional = true }
wgpu           = { version = "27", optional = true }
bytemuck       = { workspace = true, optional = true }
nalgebra     = { workspace = true }
log          = { workspace = true }
env_logger   = { workspace = true }

[[example]]
name = "mfem_ex1_poisson"
path = "mfem_ex1_poisson.rs"

[[example]]
name = "mfem_ex1_gpu"
path = "mfem_ex1_gpu.rs"
required-features = ["gpu"]

[[example]]
name = "mfem_ex_iga_poisson_1d"
path = "mfem_ex_iga_poisson_1d.rs"

[[example]]
